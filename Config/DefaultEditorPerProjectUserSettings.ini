; Squad Command is multiplayer-only (dedicated server + clients), so Play-in-Editor defaults to the
; same shape: a dedicated server running in the editor plus two networked clients, with mild lag and
; packet loss. One process keeps every world reachable from editor Python tests.
; Your own Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini overrides these once you change
; them in the Play menu. For separate processes outside the editor use Scripts/LocalMultiplayer.ps1.

[/Script/UnrealEd.LevelEditorPlaySettings]
PlayNetMode=PIE_Client
RunUnderOneProcess=True
PlayNumberOfClients=2
bLaunchSeparateServer=False
ServerPort=17777
NetworkEmulationSettings=(bIsNetworkEmulationEnabled=True,EmulationTarget=Client,CurrentProfile="Custom",OutPackets=(MinLatency=30,MaxLatency=60,PacketLossPercentage=1),InPackets=(MinLatency=30,MaxLatency=60,PacketLossPercentage=1))
